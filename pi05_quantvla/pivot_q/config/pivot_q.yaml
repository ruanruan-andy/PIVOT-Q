paths:
  root_dir: /lumos-vePFS/suzhou/Users/ruan/PIVOT-Q
  pivot_q_dir: .
  quantvla_dir: third_party/QuantVLA
  libero_dir: third_party/LIBERO
  libero_plus_dir: third_party/LIBERO-plus
  manifest: manifests/libero_plus_first20.json
  checkpoint: pi05_quantvla/models/pi05_libero
  quant_pack_dir: pi05_quantvla/models/quantvla
  results_dir: outputs/quantvla/pi05/pivot_q/train

experiment:
  name: pi05_pivot_q
  anchor_lambda: 0.1

training:
  seed: 0
  resume: true
  updates_per_episode: 5
  learning_rate: 5.0e-5
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  anchor_replay_size: 256
  anchor_batch_size: 4
  save_every_steps: 25
  keep_last_checkpoints: 1

distributed:
  suites:
    - libero_spatial
    - libero_object
    - libero_goal
    - libero_10
  master_port: 6140
  rollout_ports: [6100, 6110, 6120, 6130]
  clean_anchor_ports: [6101, 6111, 6121, 6131]

selection:
  temporal_horizon: 4
  temporal_discount: 0.9
  alpha_q: 0.5
  beta_r: 0.5
  phase_bins: 4
  top_per_phase: 4
  min_temporal_gap: 4
